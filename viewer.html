<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Scroll Capture 预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px -apple-system, "PingFang SC", sans-serif; background: #f4f5f7; color: #222; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e3e5e8; }
  header strong { font-size: 14px; }
  header .meta { color: #888; }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #d0d3d8; background: #fff; border-radius: 6px; cursor: pointer; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .banner { display: none; margin: 12px 16px 0; padding: 10px 12px; border-radius: 8px; background: #fdecea; border: 1px solid #f5c6c0; color: #a12b20; white-space: pre-wrap; }
  .wrap { padding: 16px; }
  #img { max-width: 100%; display: block; margin: 0 auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  #empty { display: none; padding: 40px; text-align: center; color: #888; }
  details { margin: 16px; background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; }
  details summary { cursor: pointer; padding: 10px 12px; font-weight: 600; }
  #log { margin: 0; padding: 12px; max-height: 320px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #333; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <strong>Scroll Capture</strong>
  <span class="meta" id="size"></span>
  <span class="spacer"></span>
  <button id="dl" class="primary">保存 PNG</button>
</header>
<div class="banner" id="banner"></div>
<div class="wrap">
  <div id="empty">还没有截图。切到目标标签页，按 Option+Shift+S 或点扩展图标。</div>
  <img id="img" alt="">
</div>
<details id="logbox">
  <summary>运行日志</summary>
  <pre id="log"></pre>
</details>
<script src="viewer.js"></script>
</body>
</html>
